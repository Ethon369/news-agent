name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Environment info
        run: |
          python -V
          python -m pytest --version
          python -m ruff --version

      - name: Lint
        run: python -m ruff check app tests

      - name: Tests (全部离线：mock LLM + fixture 新闻源)
        env:
          LLM_MODE: mock
          SCHEDULER_ENABLED: "false"
        run: |
          set +e
          python -m pytest -q --tb=short 2>&1 | tee /tmp/pytest.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error::pytest failed with exit code $code"
            echo "----- failed tests -----"
            grep -E "^(FAILED|ERROR)" /tmp/pytest.log | head -20 | while IFS= read -r line; do
              echo "::error title=FailedTest::$line"
            done
            echo "----- traceback tail -----"
            tail -n 120 /tmp/pytest.log
            exit "$code"
          fi
